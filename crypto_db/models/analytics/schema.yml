version: 2
models:
  # =========================
  # COIN TREND METRICS
  # =========================
  - name: coin_trend_metrics
    description: "Moving average across various time windows"
    columns:
      - name: asset_id
        tests:
        - not_null
      - name: ingestion_timestamp
        tests:
         - not_null
      - name: price
        tests: 
         - not_null
      - name: avg_price_1_day
        tests:
          - not_null
      - name: avg_price_3_day
        tests:
          - not_null
      - name: avg_price_7_day
        tests:
          - not_null
    tests: 
    #grain
      - dbt_utils.unique_combination_of_columns:
            combination_of_columns:
                - asset_id
                - ingestion_timestamp
    # sanity checks
      - dbt_utils.expression_is_true:
          expression: "price >= 0"
      - dbt_utils.expression_is_true:
          expression: "avg_price_1_day >= 0"
      - dbt_utils.expression_is_true:
          expression: "avg_price_7_day >= 0"
  # =========================
  # coin_daily_price_range_analysis
  # =========================
  - name: coin_daily_price_range_analysis
    description: "Daily OHLC metrics for each crypto asset"
    columns:
      - name: asset_id
        tests:
        - not_null
      - name: observation_day
        tests:
        - not_null
      - name: open
        tests: 
        - not_null
      - name: high
        tests: 
        - not_null
      - name: low
        tests: 
        - not_null
      - name: close
        tests: 
        - not_null
      - name: range
        tests: 
        - not_null
      - name: pct_change
        tests: 
        - not_null
    tests: 
      #grain
      - dbt_utils.unique_combination_of_columns:
            combination_of_columns:
                - asset_id
                - observation_day
      #high
      - dbt_utils.expression_is_true:
          expression: "high >= open"
      - dbt_utils.expression_is_true:
          expression: "high >= close"
      #low
      - dbt_utils.expression_is_true:
          expression: "low <= open"
      - dbt_utils.expression_is_true:
          expression: "low <= close"
      #range
      - dbt_utils.expression_is_true:
          expression: "range = high - low"
    
  
      
        
      

      
    